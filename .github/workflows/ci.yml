name: CI - Validate PR and Auto Merge

on:
  pull_request:
    branches:
      - intermediate
    types: [opened, synchronize, reopened]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 22.11.0
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build project
        run: npm run build

      - name: Auto-merge PR to develop
        if: success()
        uses: peter-evans/merge-pull-request@v3
        with:
          token: ${{ secrets.GH_PAT }}
          merge-method: squash
          commit-message: "CI: merged PR automatically after successful checks"
          base: develop
